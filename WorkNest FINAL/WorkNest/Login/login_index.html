<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkNest Sign In</title>
<!-- This links our CSS design file to this page -->
<link rel="stylesheet" href="login_style.css">
</head>
<body>

<!-- "wrapper" holds the whole page: left info panel + right form panel -->
<div class="wrapper">

  <!-- ================= LEFT SIDE: dark brand/info panel ================= -->
  <div class="panel-left">
    <div class="grid-bg"></div> <!-- decorative background grid lines -->

    <!-- Logo + company name at the top -->
    <div class="brand">
      <div class="logo">
        <img src="logo.png" alt="WorkNest logo">
      </div>
      <span class="brand-name">WorkNest</span>
    </div>

    <!-- Marketing text in the middle of the left panel -->
    <div class="left-content">
      <div class="badge"><span class="dot"></span>Real-Time Workforce Analytics</div>
      <h1>Manage your<br><span class="grad">people, smarter.</span></h1>
      <p>WorkNest brings HR, managers, and employees into one unified workspace — simplifying workforce management, all in one place.</p>
    </div>

    <div></div> <!-- empty spacer to push content apart (keeps layout balanced) -->
  </div>

  <!-- ================= RIGHT SIDE: the actual sign-in form ================= -->
  <div class="panel-right">
    <div class="form-container">
      <h2>Welcome back</h2>
      <p class="subtext">Sign in to your WorkNest account</p>

      <!-- This box shows success/error messages after submitting the form -->
      <div class="msg" id="topMsg" style="display:none;"></div>

      <!-- The sign-in form itself. "novalidate" turns off the browser's
           built-in validation because we do our own custom validation in JS -->
      <form id="loginForm" novalidate>

        <!-- User ID field -->
        <div class="field">
          <label for="userId">USER ID</label>
          <input type="text" id="userId" placeholder="EMP-001" autocomplete="username">
          <div class="field-error" id="userIdError"></div>
        </div>

        <!-- Password field with a show/hide (eye) button -->
        <div class="field">
          <div class="label-row">
            <label for="password" style="margin-bottom:0;">PASSWORD</label>
            <a href="forgot_index.html">Forgot password?</a>
          </div>
          <div class="password-wrap" style="margin-top:8px;">
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
            <!-- Eye icon button: clicking it toggles password visibility (see login_script.js) -->
            <button type="button" class="eye-toggle" id="eyeToggle" aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <div class="field-error" id="passwordError"></div>
        </div>

        <!-- Submit button -->
        <button type="submit" class="btn">Sign in</button>
      </form>
    </div>
  </div>

</div>

<!-- All the sign-in logic (validation + checking the user) lives here -->
<script src="login_script.js"></script>
</body>
</html>
