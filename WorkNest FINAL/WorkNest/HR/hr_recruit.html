<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruit Employee - WorkNest</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="hr_dashboard.css">
    <link rel="stylesheet" href="hr_recruit.css">
</head>
<body>
    <nav class="hrSidebar">
        <div class="hrSidebar_header">
            <div class="hrSidebar_brandMark">W</div>
            <div class="hrSidebar_brandText">
                <span class="hrSidebar_logo">WorkNest</span>
                <span class="hrSidebar_role">HR Panel</span>
            </div>
        </div>
        <ul class="hrSidebar_nav">
            <li class="hrSidebar_navItem"><a href="hr_dashboard.html" class="hrSidebar_navLink">Dashboard</a></li>
            <li class="hrSidebar_navItem"><a href="hr_update_employee.html" class="hrSidebar_navLink">Update Employee</a></li>
            <li class="hrSidebar_navItem active"><a href="hr_recruit.html" class="hrSidebar_navLink">Recruit Employee</a></li>
            <li class="hrSidebar_navItem"><a href="hr_promote.html" class="hrSidebar_navLink">Promote Employee</a></li>
            <li class="hrSidebar_navItem"><a href="hr_terminate.html" class="hrSidebar_navLink">Terminate Employee</a></li>
            <li class="hrSidebar_navItem"><a href="hr_leave_requests.html" class="hrSidebar_navLink">Leave Requests</a></li>
            <li class="hrSidebar_navItem"><a href="../Login/login_index.html" class="hrSidebar_navLink logout">Logout</a></li>
        </ul>
    </nav>

    <main class="hrMain">
        <header class="hrHeader">
            <div class="hrHeader_content">
                <h1 class="hrHeader_title">Recruit Employee</h1>
                <p class="hrHeader_subtitle">Add a new employee to the system</p>
            </div>
            <div class="hrHeader_actions">
                <div class="hrHeader_who">
                    <div class="hrHeader_profile">AR</div>
                    <div class="hrHeader_whoText">
                        <strong>Ayesha Rahman</strong>
                        <span>HR Manager</span>
                    </div>
                </div>
            </div>
        </header>

        <div class="hrForm">
            <div id="hrForm_messageBox"></div>

            <form id="hrRecruit_form">
                <div class="hrForm_grid">
                    <div class="hrForm_group">
                        <label class="hrForm_label">Username <span class="required">*</span></label>
                        <input type="text" name="hr_userName" class="hrForm_input" required>
                    </div>
                    <div class="hrForm_group">
                        <label class="hrForm_label">Password <span class="required">*</span></label>
                        <input type="password" name="hr_password" class="hrForm_input" required>
                    </div>
                    <div class="hrForm_group">
                        <label class="hrForm_label">First Name <span class="required">*</span></label>
                        <input type="text" name="hr_firstName" class="hrForm_input" required>
                    </div>
                    <div class="hrForm_group">
                        <label class="hrForm_label">Last Name <span class="required">*</span></label>
                        <input type="text" name="hr_lastName" class="hrForm_input" required>
                    </div>
                    <div class="hrForm_group">
                        <label class="hrForm_label">Date of Birth <span class="required">*</span></label>
                        <input type="date" name="hr_dob" class="hrForm_input" required>
                    </div>
                    <div class="hrForm_group">
                        <label class="hrForm_label">Gender <span class="required">*</span></label>
                        <select name="hr_gender" class="hrForm_input" required>
                            <option value="">Select</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="hrForm_group">
                        <label class="hrForm_label">Email <span class="required">*</span></label>
                        <input type="email" name="hr_email" class="hrForm_input" required>
                    </div>
                    <div class="hrForm_group">
                        <label class="hrForm_label">Phone <span class="required">*</span></label>
                        <input type="tel" name="hr_phone" class="hrForm_input" required>
                    </div>
                    <div class="hrForm_group full">
                        <label class="hrForm_label">Address <span class="required">*</span></label>
                        <input type="text" name="hr_address" class="hrForm_input" required>
                    </div>
                    <div class="hrForm_group">
                        <label class="hrForm_label">Role <span class="required">*</span></label>
                        <select name="hr_role" class="hrForm_input" required>
                            <option value="">Select Role</option>
                            <option value="Software_Developer">Software Developer</option>
                            <option value="Software_Designer">Software Designer</option>
                            <option value="Software_Tester">Software Tester</option>
                            <option value="Salesman">Salesman</option>
                            <option value="Digital_Marketing_Specialist">Digital Marketing Specialist</option>
                            <option value="Content_Marketing_Specialist">Content Marketing Specialist</option>
                            <option value="PR_Officer">PR Officer</option>
                            <option value="Driver">Driver</option>
                            <option value="Cleaner">Cleaner</option>
                            <option value="Watchman">Watchman</option>
                        </select>
                    </div>
                    <div class="hrForm_group">
                        <label class="hrForm_label">Department <span class="required">*</span></label>
                        <select name="hr_dept" class="hrForm_input" required>
                            <option value="">Select Department</option>
                            <option value="Software">Software</option>
                            <option value="Marketing">Marketing</option>
                            <option value="Facilities">Facilities</option>
                            <option value="HR">HR</option>
                        </select>
                    </div>
                    <div class="hrForm_group">
                        <label class="hrForm_label">Salary <span class="required">*</span></label>
                        <input type="number" step="0.01" name="hr_salary" class="hrForm_input" required>
                    </div>
                    <div class="hrForm_group">
                        <label class="hrForm_label">Manager</label>
                        <select name="hr_managerId" id="hrManager_select" class="hrForm_input">
                            <option value="">Select Manager (Optional)</option>
                        </select>
                    </div>
                    <div class="hrForm_group">
                        <label class="hrForm_label">Join Date</label>
                        <input type="date" name="hr_joinDate" id="hrJoin_date" class="hrForm_input">
                    </div>
                    <button type="submit" class="hrForm_submit">Recruit Employee</button>
                </div>
            </form>
        </div>
    </main>

    <script src="mock-data.js"></script>
    <script src="hr_recruit.js"></script>
</body>
</html>
