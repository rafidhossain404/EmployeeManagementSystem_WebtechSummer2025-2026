<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Requests - WorkNest</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="hr_dashboard.css">
</head>
<body>
    <nav class="hrSidebar">
        <div class="hrSidebar_header">
            <div class="hrSidebar_brandMark">W</div>
            <div class="hrSidebar_brandText">
                <span class="hrSidebar_logo">WorkNest</span>
                <span class="hrSidebar_role">HR Panel</span>
            </div>
        </div>
        <ul class="hrSidebar_nav">
            <li class="hrSidebar_navItem"><a href="hr_dashboard.html" class="hrSidebar_navLink">Dashboard</a></li>
            <li class="hrSidebar_navItem"><a href="hr_update_employee.html" class="hrSidebar_navLink">Update Employee</a></li>
            <li class="hrSidebar_navItem"><a href="hr_recruit.html" class="hrSidebar_navLink">Recruit Employee</a></li>
            <li class="hrSidebar_navItem"><a href="hr_promote.html" class="hrSidebar_navLink">Promote Employee</a></li>
            <li class="hrSidebar_navItem"><a href="hr_terminate.html" class="hrSidebar_navLink">Terminate Employee</a></li>
            <li class="hrSidebar_navItem active"><a href="hr_leave_requests.html" class="hrSidebar_navLink">Leave Requests</a></li>
            <li class="hrSidebar_navItem"><a href="../Login/login_index.html" class="hrSidebar_navLink logout">Logout</a></li>
        </ul>
    </nav>

    <main class="hrMain">
        <header class="hrHeader">
            <div class="hrHeader_content">
                <h1 class="hrHeader_title">Leave Requests</h1>
                <p class="hrHeader_subtitle">Manage all leave requests</p>
            </div>
            <div class="hrHeader_actions">
                <div class="hrHeader_who">
                    <div class="hrHeader_profile">AR</div>
                    <div class="hrHeader_whoText">
                        <strong>Ayesha Rahman</strong>
                        <span>HR Manager</span>
                    </div>
                </div>
            </div>
        </header>

        <div class="hrPage_filter" style="display: flex; gap: 12px; margin-bottom: 20px;">
            <select id="hrFilter_status" onchange="filterLeaves()" style="padding: 10px 16px; border: 1px solid #e6e8f0; border-radius: 8px;">
                <option value="all">All Status</option>
                <option value="Pending">Pending</option>
                <option value="Processing">Processing</option>
                <option value="Accepted">Accepted</option>
                <option value="Rejected">Rejected</option>
            </select>
            <input type="text" id="hrSearch_input" placeholder="Search by name..." onkeyup="filterLeaves()" style="padding: 10px 16px; border: 1px solid #e6e8f0; border-radius: 8px; flex: 1;">
        </div>

        <div class="hrTableContainer">
            <table class="hrEmployeeTable" id="hrLeave_table">
                <thead>
                    <tr><th>ID</th><th>Employee</th><th>Department</th><th>Start Date</th><th>End Date</th><th>Reason</th><th>Status</th><th>Actions</th></tr>
                </thead>
                <tbody id="hrLeave_body">
                    <tr><td colspan="8" class="hrEmptyState">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="mock-data.js"></script>
    <script src="hr_leave_requests.js"></script>
</body>
</html>
